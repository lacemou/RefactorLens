name: Build, attest, and release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Obsidian plugin lint
        run: npm run lint

      - name: Build release assets
        run: npm run build

      - name: Verify tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_TAG;
            if (manifest.version !== tag || pkg.version !== tag) {
              throw new Error(`Tag ${tag}, manifest ${manifest.version}, and package ${pkg.version} must match`);
            }
          '

      - name: Generate build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --verify-tag \
            --title "Refactor Lens ${GITHUB_REF_NAME}" \
            --generate-notes
